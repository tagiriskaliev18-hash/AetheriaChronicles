<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#221928"/>
      <stop offset="55%" stop-color="#0d0e17"/>
      <stop offset="100%" stop-color="#07070c"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe7a8"/>
      <stop offset="45%" stop-color="#d4a046"/>
      <stop offset="100%" stop-color="#7c5319"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ff6238"/>
      <stop offset="48%" stop-color="#cc2424"/>
      <stop offset="100%" stop-color="#690e14"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="44%" r="36%">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d9421c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d9421c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded Obsidian Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="10"/>
  <rect x="34" y="34" width="444" height="444" rx="88" fill="none" stroke="#d8b268" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Warm Sunset Halo Behind Crest -->
  <circle cx="256" cy="240" r="170" fill="url(#emberGlow)"/>

  <!-- Heraldic Ring & Rune Ticks -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldBorder)" stroke-width="3.5" stroke-opacity="0.65"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.32" stroke-dasharray="10 14"/>

  <!-- Stylized Crimson Dragon Wings + Silhouette -->
  <g transform="translate(256,262)">
    <!-- Left & Right Swept Dragon Wings -->
    <path d="M -18,-10 C -68,-74 -134,-94 -158,-68 C -144,-34 -128,-4 -110,24 C -94,2 -72,-6 -54,12 C -46,-2 -30,-6 -18,10 Z"
          fill="url(#dragonGrad)" stroke="#ffba7a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 18,-10 C 68,-74 134,-94 158,-68 C 144,-34 128,-4 110,24 C 94,2 72,-6 54,12 C 46,-2 30,-6 18,10 Z"
          fill="url(#dragonGrad)" stroke="#ffba7a" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Horned Dragon Crest / Head & Sweeping Tail -->
    <path d="M 0,-118 L 22,-72 L 46,-96 L 30,-48 L 16,28 L 28,92 L 0,136 L -28,92 L -16,28 L -30,-48 L -46,-96 L -22,-72 Z"
          fill="url(#dragonGrad)" stroke="#ffe09e" stroke-width="3" stroke-linejoin="round"/>

    <!-- Golden Sword / Rune Spine Axis -->
    <path d="M 0,-102 L 10,-28 L 0,118 L -10,-28 Z" fill="url(#goldBorder)"/>
    <path d="M -34,-28 L 34,-28 L 24,-18 L -24,-18 Z" fill="url(#goldBorder)"/>

    <!-- Cyan Arcane Core Jewel -->
    <polygon points="0,-54 11,-38 0,-22 -11,-38" fill="#6ef7ff" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>
